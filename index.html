                  <li style={{ marginBottom: '10px' }}>Vi delar aldrig dina uppgifter med tredje part</li>
                  <li>Du kan begära att få dina uppgifter raderade</li>
                </ul>
              </div>

              {/* Kontakta oss */}
              <div style={{ marginBottom: '28px', backgroundColor: `${COLORS.sandBrown}15`, padding: '16px', borderRadius: '12px', borderLeft: `4px solid ${COLORS.sandBrown}` }}>
                <h3 style={{ margin: '0 0 12px 0', color: COLORS.earthBrown, fontSize: '16px', fontWeight: '600' }}>📞 Kontakta oss</h3>
                <p style={{ margin: '0', fontSize: '14px', lineHeight: '1.6' }}>
                  E-post: <strong>lias@hantverkeri.se</strong><br />
                  Tel: <strong>070-XXX XX XX</strong><br />
                  Adress: Karlskoga, Sverige
                </p>
              </div>

              {/* Dina rättigheter */}
              <div>
                <h3 style={{ margin: '0 0 12px 0', color: COLORS.earthBrown, fontSize: '16px', fontWeight: '600' }}>⚖️ Dina rättigheter</h3>
                <p style={{ margin: '0', fontSize: '14px', lineHeight: '1.6' }}>Du har rätt till insyni, rättelse, radering och dataportabilitet enligt GDPR.</p>
              </div>
            </div>

            {/* Footer Button */}
            <div style={{ padding: '20px 28px 28px', borderTop: 'none', backgroundColor: 'transparent', display: 'flex', gap: '12px', justifyContent: 'flex-end' }}>
              <button onClick={onOk} disabled={!scrolled} style={{ padding: '14px 32px', backgroundColor: scrolled ? COLORS.sandBrown : `${COLORS.sandBrown}60`, color: COLORS.sand1, border: 'none', borderRadius: '12px', cursor: scrolled ? 'pointer' : 'not-allowed', fontWeight: '600', fontSize: '15px', opacity: scrolled ? 1 : 0.6, transition: 'all 0.2s', boxShadow: scrolled ? `0 8px 20px rgba(145, 116, 74, 0.25)` : 'none' }}>
                Jag förstår och accepterar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Header({ state }) {
      const home = state.tab === 'home';
      return <AppHeader title={PAGE_TITLES[state.tab] || 'Lias Hantverkeri'} subtitle={home ? 'Skapa · Vårda · Inspireras' : 'Lias Hantverkeri'} />;
    }

    function Nav({ state, dispatch }) {
      return <BottomNavigation active={state.tab} onSelect={id => dispatch({ type: 'TAB', p: id })} />;
    }

    // ===== BILDER – byt null / tillfälliga bilder mot riktiga filer, t.ex. 'images/salong-miljo.jpg' =====
    const PIC = window.LH_IMG || {};
    const IMG = {
      salongMiljo: PIC['salong-miljo'],
      frisorDetalj: PIC['frisor-detalj'],
      keramikDrejning: PIC['keramik-drejning'],
      keramikverkstadMiljo: PIC['keramikverkstad-miljo'],
      produktKopp: PIC['produkt-kopp'],
      produktSkal: PIC['produkt-skal'],
      produktKruka: PIC['produkt-kruka'],
      produktPresentset: PIC['produkt-presentset'],
      produktTallrik: PIC['produkt-tallrik'],
      produktVas: PIC['produkt-vas'],
      bannerGalleri: PIC['banner-galleri'],
      bannerKontakt: PIC['banner-kontakt'],
      bannerBoka: PIC['banner-boka'],
      galleriHerrklipp: PIC['galleri-herrklipp'],
      galleriBarnklipp: PIC['galleri-barnklipp'],
      galleriStyling: PIC['galleri-styling'],
    };
    // Produktbilder per produkt-id. Alla produkter har bild (visar "Bild kommer").
    const PRODUCT_IMG = { 's-cup': IMG.produktKopp, 's-bowl': IMG.produktSkal, 's-pot': IMG.produktKruka, 's-set': IMG.produktPresentset, 's-vase': IMG.produktVas, 's-plate': IMG.produktTallrik };

    function Home({ dispatch }) {
      const entries = [
        { id: 'boka', title: 'Boka frisör', text: 'Klippning, färgning, styling – för all ålder', cta: 'Boka tid', icon: 'scissors', img: IMG.frisorDetalj, go: () => dispatch({ type: 'START_BOOK' }) },
        { id: 'kurser', title: 'Upptäck keramikkurser', text: 'Lär dig keramik från grunden eller utveckla dina färdigheter', cta: 'Se kurser', icon: 'palette', img: IMG.keramikDrejning, go: () => dispatch({ type: 'TAB', p: 'courses' }) },
        { id: 'shop', title: 'Besök keramikshoppen', text: 'Handgjorda keramikprodukter – unika och vackra', cta: 'Till shoppen', icon: 'bag', img: IMG.produktKopp, go: () => dispatch({ type: 'TAB', p: 'shop' }) },
      ];
      return (
        <div className="lh-home">
          <section className="lh-hero" aria-labelledby="hero-rubrik">
            <ResponsiveImage src={IMG.salongMiljo} alt="Miljö från Lias salong" ratio="16 / 10" radius={0} eager fallbackLabel="Miljöbild kommer" />
            <div className="lh-hero__text">
              <h2 id="hero-rubrik">Välkommen till Lias Hantverkeri</h2>
              <p className="lh-hero__sub">Frisörsalong och keramikverkstad i Karlskoga</p>
              <p className="lh-hero__msg">Skapa, vårda och inspireras.</p>
            </div>
          </section>

          <h2 className="lh-home__h">Vad vill du göra?</h2>
          <div className="lh-entries">
            {entries.map(e => (
              <button key={e.id} type="button" className="lh-entry" data-entry={e.id} onClick={e.go}>
                <div className="lh-entry__img"><ResponsiveImage src={e.img} alt="" ratio="1 / 1" radius={14} fallbackLabel="" /></div>
                <div className="lh-entry__body">
                  <span className="lh-entry__title"><Icon name={e.icon} size={20} />{e.title}</span>
                  <span className="lh-entry__text">{e.text}</span>
                  <span className="lh-entry__cta">{e.cta}<Icon name="chevronRight" size={18} /></span>
                </div>
              </button>
            ))}
          </div>

          <Card className="lh-intro">
            <p>Hos oss får du en personlig frisörklipp eller en kreativ keramik-upplevelse i vår verkstad i Karlskoga.</p>
          </Card>
        </div>
      );
    }

    // Inspirationsbilder per kategori (AI-genererade tills Lia lägger in egna)
    const CAT_IMG = { Herr: IMG.galleriHerrklipp, Dam: IMG.galleriStyling, Barn: IMG.galleriBarnklipp };
    const MAX_PERSONS = 4;
    const newPerson = () => ({ cat: null, cut: null, addons: [], name: '' });
    const personServices = p => SERVICES.filter(s => s.id === p.cut || p.addons.includes(s.id));
    const personDur = p => personServices(p).reduce((a, s) => a + s.dur, 0);
    const personPrice = p => personServices(p).reduce((a, s) => a + s.price, 0);
    const personNames = p => personServices(p).sort((a, b) => (b.cut ? 1 : 0) - (a.cut ? 1 : 0)).map(s => s.name).join(', ');

    function Booking({ dispatch }) {
      const [step, setStep] = useState(1);
      const [people, setPeople] = useState([newPerson()]);
      const [pTried, setPTried] = useState(false);
      const [day, setDay] = useState(null);
      const [busy, setBusy] = useState([]);
      const [busyState, setBusyState] = useState('idle');
      const [slot, setSlot] = useState(null);
      const [form, setForm] = useState({ name: '', phone: '', email: '' });
      const [tried, setTried] = useState(false);
      const [sending, setSending] = useState(false);
      const [error, setError] = useState(null);
      const [done, setDone] = useState(null);
      const days = React.useMemo(() => upcomingDays(14), []);

      useEffect(() => { window.scrollTo(0, 0); }, [step, done]);

      const multi = people.length > 1;
      const totalDur = people.reduce((a, p) => a + personDur(p), 0);
      const totalPrice = people.reduce((a, p) => a + personPrice(p), 0);
      const allCuts = people.every(p => p.cut);
      const nameOk = p => !multi || p.name.trim().length >= 2;
      const label = (p, i) => multi ? (p.name.trim() || 'Person ' + (i + 1)) : null;

      const update = (i, patch) => { setPeople(ps => ps.map((p, j) => j === i ? { ...p, ...patch } : p)); setSlot(null); };
      const pickCat = (i, cat) => update(i, people[i].cat === cat ? {} : { cat, cut: null, addons: [] });
      const toggleAddon = (i, id) => update(i, { addons: people[i].addons.includes(id) ? people[i].addons.filter(x => x !== id) : [...people[i].addons, id] });
      const addPerson = () => { if (people.length < MAX_PERSONS) { setPeople(ps => [...ps, newPerson()]); setSlot(null); setTimeout(() => { const el = document.querySelector(`[data-person="${people.length}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); } };
      const removePerson = i => { setPeople(ps => ps.filter((_, j) => j !== i)); setSlot(null); };
      const goStep2 = () => {
        setPTried(true);
        if (!allCuts || !people.every(nameOk)) {
          setTimeout(() => { const el = document.querySelector('[data-person] [data-err]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30);
          return;
        }
        setStep(2); setError(null);
      };

      const loadBusy = async d => {
        setBusyState('loading'); setBusy([]);
        try {
          const from = stockholmMs(d.y, d.m, d.d, 0, 0), to = stockholmMs(d.y, d.m, d.d, 23, 59);
          const { data, error: err } = await sb.rpc('get_busy', { p_from: new Date(from).toISOString(), p_to: new Date(to).toISOString() });
          if (err) throw err;
          setBusy((data || []).map(b => ({ s: new Date(b.starts_at).getTime(), e: new Date(b.ends_at).getTime() })));
          setBusyState('ok');
        } catch (e) { console.error(e); setBusyState('error'); }
      };
      const pickDay = d => { setDay(d); setSlot(null); setError(null); loadBusy(d); };
      // En frisör: hela kedjan (alla personer efter varandra) måste vara ledig
      const slots = day && busyState === 'ok' ? daySlots(day, totalDur, busy) : [];
      const chain = start => { let t = start; return people.map((p, i) => { const s = t; t += personDur(p) * 60000; return { p, i, s, e: t }; }); };

      const v = contactCheck(form);
      const submit = async () => {
        setTried(true);
        if (!v.all || sending) return;
        setSending(true); setError(null);
        try {
          const { data, error: err } = await sb.rpc('create_booking', {
            p_people: people.map(p => ({ category: p.cat, service_ids: [p.cut, ...p.addons], name: multi ? p.name.trim() : '' })),
            p_starts_at: new Date(slot).toISOString(),
            p_name: form.name.trim(), p_phone: v.phoneDigits, p_email: form.email.trim(),
          });
          if (err) throw err;
          setDone(data);
        } catch (e) {
          const r = bookingErrorText(e);
          setError(r.text);
          if (['TIDEN_UPPTAGEN', 'OGILTIG_TID', 'UTANFOR_OPPETTID'].includes(r.code)) { setSlot(null); setStep(2); if (day) loadBusy(day); }
          if (['EN_KLIPPNING_PER_PERSON', 'OGILTIGT_PERSONNAMN', 'OGILTIGT_ANTAL_PERSONER', 'OGILTIGA_TJANSTER'].includes(r.code)) setStep(1);
        }
        setSending(false);
      };

      if (!sb) {
        return (
          <div className="lh-flow">
            <Card>
              <h2 className="lh-cardtitle">Onlinebokningen öppnar snart</h2>
              <p style={{ margin: 0, fontSize: '16px', lineHeight: 1.5 }}>Under tiden kan du boka genom att kontakta Lia på <strong>{CONTACT.phone}</strong> eller <strong>{CONTACT.email}</strong>.</p>
            </Card>
          </div>
        );
      }

      if (done) {
        const s = new Date(done.starts_at).getTime(), e = new Date(done.ends_at).getTime();
        const items = done.items || [{ person_name: null, service_names: done.service_names, starts_at: done.starts_at, ends_at: done.ends_at }];
        return (
          <div className="lh-flow">
            <DoneCard title={items.length > 1 ? `${items.length} tider är bokade!` : 'Din tid är bokad!'} sub={`Välkommen, ${form.name.trim().split(' ')[0]}!`} onDone={() => dispatch({ type: 'TAB', p: 'home' })} lines={[
              <InfoRow icon="calendar"><strong>{fmtDayLong(s)}</strong></InfoRow>,
              ...items.map(it => <InfoRow icon="scissors"><strong>{fmtTime(new Date(it.starts_at).getTime())}–{fmtTime(new Date(it.ends_at).getTime())}</strong> {it.person_name ? it.person_name + ': ' : ''}{it.service_names}</InfoRow>),
              ...(items.length > 1 ? [<InfoRow icon="clock">Totalt {fmtTime(s)}–{fmtTime(e)}</InfoRow>] : []),
              <InfoRow icon="tag"><strong>{formatPrice(done.price)}</strong> (betalas på plats)</InfoRow>,
            ]}>
              {DEMO && (
                <div style={{ textAlign: 'left' }}>
                  <div style={{ fontSize: '14px', fontWeight: '700', color: T.color.textMuted, marginBottom: '6px' }}>Demo: sms som skulle ha skickats till dig</div>
                  {demoLoad().sms.filter(m => m.bookingId === done.id && m.kind === 'bekraftelse').map(m => <DemoSmsBubble key={m.id} sms={m} />)}
                </div>
              )}
              <p className="lh-done__note">Ta gärna en skärmbild. Behöver du ändra eller avboka? Kontakta Lia på <strong>{CONTACT.phone}</strong>.</p>
            </DoneCard>
          </div>
        );
      }

      // ---------- STEG 1: vem och vad ----------
      if (step === 1) {
        return (
          <div className="lh-flow">
            <div data-banner="boka" style={{ marginBottom: '16px' }}><ResponsiveImage src={IMG.bannerBoka} alt="Boka tid – för en stund som är din. Klippning, färgning, styling för herr, dam och barn. Bild från en salong med spegel och frisörstol." ratio="3 / 2" eager /></div>
            <StepTitle n={1} total={3} title="Välj klippning" sub={multi ? 'Varje person får en klippning och valfria tillägg. Personerna klipps efter varandra.' : 'Välj en klippning och eventuella tillägg. Fler personer kan läggas till.'} />
            {people.map((p, i) => {
              const cuts = p.cat ? SERVICES.filter(s => s.cat === p.cat && s.cut) : [];
              const addons = p.cat ? SERVICES.filter(s => s.cat === p.cat && !s.cut) : [];
              return (
                <section key={i} className="lh-card lh-person" data-person={i} aria-labelledby={'person-' + i}>
                  <div className="lh-person__head">
                    <h3 id={'person-' + i}>{multi ? 'Person ' + (i + 1) : 'Vem ska klippas?'}</h3>
                    {multi && <Button variant="ghost" icon="x" data-remove={i} onClick={() => removePerson(i)} aria-label={'Ta bort person ' + (i + 1)}>Ta bort</Button>}
                  </div>
                  {multi && <FormField id={'boka-p' + i + '-namn'} label="Förnamn" required autoComplete="off" value={p.name} onChange={e => update(i, { name: e.target.value })} error={pTried && !nameOk(p) ? 'Skriv förnamnet, så att Lia vet vem hon ska klippa.' : null} />}
                  {multi && <div className="lh-person__q">Vem ska klippas?</div>}
                  <div className="lh-cats" role="group" aria-label={'Kategori för ' + (multi ? 'person ' + (i + 1) : 'klippningen')}>
                    {['Herr', 'Dam', 'Barn'].map(cat => (
                      <button key={cat} type="button" className="lh-catbtn" data-cat={cat} aria-pressed={p.cat === cat ? 'true' : 'false'} onClick={() => pickCat(i, cat)}>
                        <span className="lh-catbtn__img"><ResponsiveImage src={CAT_IMG[cat]} alt="" ratio="1 / 1" radius={12} fallbackLabel="" />{p.cat === cat && <span className="lh-catbtn__chk" aria-hidden="true"><Icon name="check" size={16} strokeWidth={3} /></span>}</span>
                        <span className="lh-catbtn__name">{cat}</span>
                      </button>
                    ))}
                  </div>
                  {!p.cat && <p className="lh-person__hint">Bilderna är inspirationsbilder.</p>}
                  {p.cat && <>
                    <div className="lh-person__q" id={'klipp-' + i}>Klippning <span className="lh-person__sub">(välj en)</span></div>
                    <div className="lh-opts" role="radiogroup" aria-labelledby={'klipp-' + i}>
                      {cuts.map(svc => {
                        const on = p.cut === svc.id;
                        return (
                          <button key={svc.id} type="button" role="radio" aria-checked={on ? 'true' : 'false'} aria-pressed={on ? 'true' : 'false'} className="lh-opt lh-opt--radio" data-service={svc.id} onClick={() => update(i, { cut: svc.id })}>
                            <span className="lh-opt__check" aria-hidden="true">{on && <Icon name="check" size={16} strokeWidth={3} />}</span>
                            <span className="lh-opt__main"><span className="lh-opt__name">{svc.name}</span><span className="lh-opt__meta"><span><Icon name="clock" size={16} />{svc.dur} min</span>{on && <span className="lh-opt__vald">Vald</span>}</span></span>
                            <span className="lh-opt__price">{formatPrice(svc.price)}</span>
                          </button>
                        );
                      })}
                    </div>
                    {pTried && !p.cut && <div className="lh-err-inline" role="alert" data-err="true" style={{ marginTop: '8px' }}><Icon name="alert" size={16} />Välj en klippning.</div>}
                    {addons.length > 0 && <>
                      <div className="lh-person__q" id={'till-' + i}>Tillägg <span className="lh-person__sub">(valfritt)</span></div>
                      <div className="lh-opts" role="group" aria-labelledby={'till-' + i}>
                        {addons.map(svc => {
                          const on = p.addons.includes(svc.id);
                          return (
                            <button key={svc.id} type="button" className="lh-opt" data-service={svc.id} aria-pressed={on ? 'true' : 'false'} onClick={() => toggleAddon(i, svc.id)}>
                              <span className="lh-opt__check lh-opt__check--box" aria-hidden="true">{on && <Icon name="check" size={16} strokeWidth={3} />}</span>
                              <span className="lh-opt__main"><span className="lh-opt__name">{svc.name}</span><span className="lh-opt__meta"><span><Icon name="clock" size={16} />{svc.dur} min</span>{on && <span className="lh-opt__vald">Vald</span>}</span></span>
                              <span className="lh-opt__price">{formatPrice(svc.price)}</span>
                            </button>
                          );
                        })}
                      </div>
                    </>}
                  </>}
                </section>
              );
            })}
            {pTried && !allCuts && people.length > 1 && <div className="lh-ferr-page" role="alert" style={{ marginBottom: '8px' }}><Icon name="alert" size={18} />Välj en klippning för varje person.</div>}
            {people.length < MAX_PERSONS
              ? <Button variant="secondary" block icon="plus" data-add-person="true" onClick={addPerson} className="lh-addperson">Lägg till person ({people.length} av {MAX_PERSONS})</Button>
              : <p className="lh-steph__sub" style={{ margin: '0 0 12px' }}><Icon name="info" size={18} />Högst {MAX_PERSONS} personer per bokning.</p>}
            {people.some(p => p.cut) && (
              <Card className="lh-sum" data-summary="tjanster" aria-live="polite">
                <h3 className="lh-cardtitle" style={{ fontSize: '18px', margin: 0 }}>Din bokning</h3>
                {people.map((p, i) => p.cut && <InfoRow key={i} icon="scissors">{multi ? <strong>{label(p, i)}: </strong> : null}{personNames(p)} · {personDur(p)} min</InfoRow>)}
                <InfoRow icon="clock">Sammanlagt {totalDur} min{multi ? ', efter varandra' : ''}</InfoRow>
                <InfoRow icon="tag"><strong>{formatPrice(totalPrice)}</strong></InfoRow>
              </Card>
            )}
            <ActionBar label={allCuts ? `Fortsätt · ${totalDur} min · ${formatPrice(totalPrice)}` : (multi ? 'Välj klippning för alla' : 'Välj en klippning')} enabled={allCuts} onClick={goStep2} />
          </div>
        );
      }

      // ---------- STEG 2: dag och tid ----------
      if (step === 2) {
        return (
          <div className="lh-flow">
            <StepTitle n={2} total={3} title="Välj dag och tid" sub={multi ? `${people.length} personer efter varandra · ${totalDur} min` : `${personNames(people[0])} · ${totalDur} min`} onBack={() => { setStep(1); setError(null); }} />
            <ErrorBox text={error} />
            <div className="lh-label" id="dag-rubrik">Dag</div>
            <div className="lh-days" role="group" aria-labelledby="dag-rubrik" style={{ overflowX: 'auto' }}>
              {days.map(d => {
                const on = day && day.key === d.key;
                const dt = new Date(d.noon);
                return (
                  <button key={d.key} type="button" className="lh-day" aria-pressed={on ? 'true' : 'false'} onClick={() => pickDay(d)}>
                    <span className="lh-day__wd">{dt.toLocaleDateString('sv-SE', { timeZone: 'UTC', weekday: 'short' }).replace('.', '')}</span>
                    <span className="lh-day__d">{d.d}</span>
                    <span className="lh-day__m">{dt.toLocaleDateString('sv-SE', { timeZone: 'UTC', month: 'short' }).replace('.', '')}</span>
                  </button>
                );
              })}
            </div>

            {!day && <Card style={{ textAlign: 'center' }}><p style={{ margin: 0, fontSize: '16px' }}>Välj en dag för att se lediga tider.</p></Card>}
            {day && busyState === 'loading' && <Card><LoadingState text="Hämtar lediga tider…" /></Card>}
            {day && busyState === 'error' && <Card><ErrorState text="Lediga tider kunde inte hämtas. Kontrollera internet." onRetry={() => loadBusy(day)} /></Card>}
            {day && busyState === 'ok' && (
              <div>
                <div className="lh-label">{fmtDayLong(d2ms(day))}{multi ? ' · starttid för första personen' : ''}</div>
                {slots.length === 0
                  ? <Card style={{ textAlign: 'center' }}><p style={{ margin: 0, fontSize: '16px' }}>Inga lediga tider {multi ? `för ${totalDur} min i följd ` : ''}den här dagen. Välj en annan dag.</p></Card>
                  : <div className="lh-times">
                      {slots.map(s => {
                        const on = slot === s;
                        return <button key={s} type="button" className="lh-time" aria-pressed={on ? 'true' : 'false'} onClick={() => { setSlot(s); setError(null); }}>{on && <Icon name="check" size={16} strokeWidth={3} />}{fmtTime(s)}</button>;
                      })}
                    </div>}
                {multi && slot && (
                  <Card className="lh-sum" style={{ marginTop: '14px' }} data-chain="true">
                    {chain(slot).map(c => <InfoRow key={c.i} icon="scissors"><strong>{fmtTime(c.s)}–{fmtTime(c.e)}</strong> {label(c.p, c.i)}: {personNames(c.p)}</InfoRow>)}
                  </Card>
                )}
              </div>
            )}
            <ActionBar label={slot ? `Fortsätt · ${fmtTime(slot)}` : 'Välj en tid'} enabled={!!slot} onClick={() => { setStep(3); setError(null); }} />
          </div>
        );
      }

      // ---------- STEG 3: uppgifter och boka ----------
      return (
        <div className="lh-flow">
          <StepTitle n={3} total={3} title="Dina uppgifter" sub="Kontrollera bokningen och fyll i dina uppgifter." onBack={() => { setStep(2); setError(null); }} />
          <ErrorBox text={error} />
          <Card className="lh-sum" data-summary="bokning">
            <InfoRow icon="calendar"><strong>{fmtDayLong(slot)}</strong></InfoRow>
            {multi
              ? chain(slot).map(c => <InfoRow key={c.i} icon="scissors"><strong>{fmtTime(c.s)}–{fmtTime(c.e)}</strong> {label(c.p, c.i)}: {personNames(c.p)}</InfoRow>)
              : <>
                  <InfoRow icon="clock"><strong>{fmtTime(slot)}–{fmtTime(slot + totalDur * 60000)}</strong></InfoRow>
                  <InfoRow icon="scissors">{personNames(people[0])}</InfoRow>
                </>}
            <InfoRow icon="tag"><strong>{formatPrice(totalPrice)}</strong> (betalas på plats)</InfoRow>
          </Card>
          <ContactFields form={form} setForm={setForm} tried={tried} idp="boka" />
          {multi && <p className="lh-steph__sub" style={{ marginTop: '10px' }}><Icon name="info" size={18} />Kontaktuppgifterna gäller hela bokningen.</p>}
          <ActionBar label={sending ? 'Bokar…' : `Boka · ${formatPrice(totalPrice)}`} enabled={!sending} onClick={submit} />
        </div>
      );
    }
    function d2ms(day) { return stockholmMs(day.y, day.m, day.d, 12, 0); }

    // ---------- Gemensamma byggstenar för kurs- och shopflödet ----------
    function useNavHeight() {
      const [h, setH] = useState(72);
      useEffect(() => {
        const m = () => { const n = document.querySelector('nav'); if (n) setH(n.offsetHeight); };
        m(); window.addEventListener('resize', m); window.addEventListener('orientationchange', m);
        return () => { window.removeEventListener('resize', m); window.removeEventListener('orientationchange', m); };
      }, []);
      return h;
    }
    function ActionBar({ label, enabled, onClick, color, textColor }) {
      const navH = useNavHeight();
      return (
        <div className="lh-actionbar" style={{ position: 'sticky', bottom: navH, zIndex: 900, margin: '24px -16px 0', padding: '10px 16px', backgroundColor: 'var(--bar-bg, #4B9FA6)' }}>
          <button className="lh-actionbar__btn" disabled={!enabled} onClick={onClick} style={{ display: 'block', width: '100%', maxWidth: '568px', margin: '0 auto', padding: '15px', backgroundColor: enabled ? (color || T.color.champagne) : 'rgba(255,255,255,0.18)', color: enabled ? (textColor || T.color.forest) : '#F4EDE0', border: 'none', borderRadius: '14px', fontWeight: '700', fontSize: '16px', minHeight: '52px', fontFamily: T.font.body, cursor: enabled ? 'pointer' : 'not-allowed' }}>{label}</button>
        </div>
      );
    }
    function StepTitle({ n, total, title, sub, onBack }) {
      return (
        <div className="lh-steph">
          {onBack && <button type="button" className="lh-steph__back" onClick={onBack}><Icon name="chevronLeft" size={20} />Tillbaka</button>}
          {n && <div className="lh-steph__count">Steg {n} av {total}</div>}
          {n && <div className="lh-steph__bar" aria-hidden="true">{Array.from({ length: total }, (_, i) => <span key={i} data-on={i < n ? 'true' : 'false'} />)}</div>}
          <h2 className="lh-steph__title">{title}</h2>
          {sub && <p className="lh-steph__sub">{sub}</p>}
        </div>
      );
    }
    function ErrorBox({ text }) {
      if (!text) return null;
      return <div className="lh-alert" role="alert"><Icon name="alert" size={20} /><span>{text}</span></div>;
    }
    function InfoRow({ icon, children }) {
      return <div className="lh-row"><Icon name={icon} size={20} /><div>{children}</div></div>;
    }
    function contactCheck(form) {
      const phoneDigits = form.phone.replace(/\D/g, '');
      const v = { name: form.name.trim().length >= 2, phone: /^0\d{9}$/.test(phoneDigits), email: /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email.trim()) };
      return { ...v, all: v.name && v.phone && v.email, phoneDigits };
    }
    function ContactFields({ form, setForm, tried, idp = 'kund' }) {
      const v = contactCheck(form);
      const f = (key, label, props, msg) => <FormField id={idp + '-' + key} label={label} required value={form[key]} onChange={e => setForm({ ...form, [key]: e.target.value })} error={tried && !v[key] ? msg : null} {...props} />;
      return (
        <div className="lh-card" style={{ marginTop: '16px' }}>
          <h3 className="lh-cardtitle" style={{ fontSize: '18px' }}>Dina uppgifter</h3>
          {f('name', 'Namn', { type: 'text', placeholder: 'För- och efternamn', autoComplete: 'name' }, 'Skriv ditt namn.')}
          {f('phone', 'Mobilnummer', { type: 'tel', placeholder: '07XXXXXXXX', autoComplete: 'tel', inputMode: 'numeric' }, 'Mobilnumret ska vara 10 siffror och börja med 0.')}
          {f('email', 'E-post', { type: 'email', placeholder: 'namn@exempel.se', autoComplete: 'email' }, 'Kontrollera e-postadressen.')}
        </div>
      );
    }
    function DoneCard({ title, sub, lines, children, onDone }) {
      return (
        <div className="lh-card lh-done" role="status">
          <div className="lh-done__icon"><Icon name="check" size={34} /></div>
          <h2>{title}</h2>
          {sub && <p className="lh-done__sub">{sub}</p>}
          <div className="lh-sum">{lines.map((l, i) => <React.Fragment key={i}>{l}</React.Fragment>)}</div>
          {children}
          <Button variant="primary" block onClick={onDone}>Klar</Button>
        </div>
      );
    }
    const ONLINE_SOON = <div style={{ ...BOX, marginBottom: '16px', fontSize: '14px', color: COLORS.dark, lineHeight: '1.6' }}>Onlinebokning och köp öppnar snart. Kontakta Lia på <strong>070-XXX XX XX</strong> eller <strong>lias@hantverkeri.se</strong>.</div>;
    const pageWrap = { padding: '20px 16px', maxWidth: '700px', margin: '0 auto' };
    const plats = n => n === 1 ? '1 plats' : n + ' platser';
    function fmtDate(ms) { const t = new Date(ms).toLocaleDateString('sv-SE', { timeZone: TZ, day: 'numeric', month: 'short' }).replace('.', ''); return t; }

    // Status för kurskortet: första omgång/tillfälle med lediga platser. "Få platser kvar" = 1–2 lediga.
    function courseStatus(c, taken) {
      if (!DEMO) return { code: 'none', next: null, left: null };
      if (taken === 'error') return { code: 'error', next: null, left: null };
      if (!taken) return { code: 'loading', next: null, left: null };
      const open = courseOccasions(c).map(o => ({ o, left: c.capacity - (taken[o.key] || 0) })).find(x => x.left > 0);
      if (!open) return { code: 'full', next: null, left: null };
      return { code: open.left <= 2 ? 'low' : 'ok', next: open.o, left: open.left };
    }

    // ---------- KURSER ----------
    function Courses() {
      const [cat, setCat] = useState('alla');
      const [seatsAll, setSeatsAll] = useState(null);
      const [seatsTry, setSeatsTry] = useState(0);
      const [step, setStep] = useState(1);
      const [course, setCourse] = useState(null);
      const [taken, setTaken] = useState(null);
      const [takenState, setTakenState] = useState('idle');
      const [occ, setOcc] = useState(null);
      const [count, setCount] = useState(1);
      const [form, setForm] = useState({ name: '', phone: '', email: '' });
      const [tried, setTried] = useState(false);
      const [sending, setSending] = useState(false);
      const [error, setError] = useState(null);
      const [done, setDone] = useState(null);
      useEffect(() => { window.scrollTo(0, 0); }, [step, done]);
      useEffect(() => {
        if (!DEMO || step !== 1 || done) return;
        let live = true;
        Promise.all(COURSES_DATA.map(c => sb.rpc('get_course_seats', { p_course_id: c.id }))).then(rs => {
          if (!live) return;
          const m = {}; rs.forEach((r, i) => { m[COURSES_DATA[i].id] = r.error ? 'error' : r.data; }); setSeatsAll(m);
        }).catch(() => { if (live) setSeatsAll(Object.fromEntries(COURSES_DATA.map(c => [c.id, 'error']))); });
        return () => { live = false; };
      }, [step, done, seatsTry]);

      const occs = course ? courseOccasions(course) : [];
      const left = o => course.capacity - ((taken && taken[o.key]) || 0);
      const loadSeats = async c => {
        setTakenState('loading');
        const { data, error: err } = await sb.rpc('get_course_seats', { p_course_id: c.id });
        if (err) { setTakenState('error'); return; }
        setTaken(data); setTakenState('ok');
      };
      const choose = c => { setCourse(c); setOcc(null); setCount(1); setError(null); setStep(2); loadSeats(c); };
      const reset = () => { setStep(1); setCourse(null); setOcc(null); setDone(null); setTried(false); setError(null); };

      const submit = async () => {
        setTried(true);
        const v = contactCheck(form);
        if (!v.all || sending) return;
        setSending(true); setError(null);
        const { data, error: err } = await sb.rpc('book_course', { p_course_id: course.id, p_occasion_key: occ.key, p_seats: count, p_name: form.name.trim(), p_phone: v.phoneDigits, p_email: form.email.trim() });
        setSending(false);
        if (err) {
          const r = bookingErrorText(err); setError(r.text);
          if (['FOR_FA_PLATSER', 'OGILTIG_OMGANG', 'OGILTIGT_ANTAL'].includes(r.code)) { setOcc(null); setStep(2); loadSeats(course); }
          return;
        }
        setDone(data);
      };

      if (done) {
        return (
          <div className="lh-flow">
            <DoneCard title="Du är anmäld!" sub={`Välkommen, ${form.name.trim().split(' ')[0]}!`} onDone={reset} lines={[
              <InfoRow icon="palette"><strong>{done.course_name}</strong></InfoRow>,
              <InfoRow icon="calendar"><strong>{fmtDayLong(new Date(done.starts_at).getTime())}</strong>{done.last_date ? ` – sista gången ${fmtDate(new Date(done.last_date).getTime())}` : ''}</InfoRow>,
              <InfoRow icon="clock"><strong>{fmtTime(new Date(done.starts_at).getTime())}–{fmtTime(new Date(done.ends_at).getTime())}</strong></InfoRow>,
              <InfoRow icon="users">{plats(done.seats)}</InfoRow>,
              <InfoRow icon="tag"><strong>{formatPrice(done.price)}</strong> (betalas på plats)</InfoRow>,
            ]}>
              <DemoSmsFor refId={done.id} kind="kurs-bekraftelse" />
            </DoneCard>
          </div>
        );
      }

      if (step === 1) {
        const shown = COURSES_DATA.filter(c => cat === 'alla' || c.cat === cat);
        return (
          <div className="lh-page">
            <div style={{ marginBottom: '14px' }}><ResponsiveImage src={IMG.keramikDrejning} alt="Händer som drejar ett kärl i lera" ratio="16 / 9" position="50% 62%" eager /></div>
            <p className="lh-page__intro">Lär dig keramik från grunden eller utveckla dina befintliga färdigheter.</p>
            {!DEMO && ONLINE_SOON}
            <div className="lh-chips" role="group" aria-label="Filtrera kurser">
              {COURSE_CATS.map(([id, label]) => <FilterChip key={id} selected={cat === id} data-chip={id} onClick={() => setCat(id)}>{label}</FilterChip>)}
            </div>
            {seatsAll && Object.values(seatsAll).includes('error') && <Card style={{ marginBottom: '14px' }}><ErrorState text="Lediga platser kunde inte hämtas just nu. Du kan ändå välja en kurs och försöka igen där." onRetry={() => { setSeatsAll(null); setSeatsTry(n => n + 1); }} /></Card>}
            <div className="lh-cgrid" aria-live="polite">
              {shown.map(c => {
                const st = courseStatus(c, seatsAll && seatsAll[c.id]);
                const drop = c.kind === 'dropin';
                return (
                  <article key={c.id} data-course={c.id} data-status={st.code} className="lh-card lh-ccard">
                    <h2 className="lh-ccard__name">{c.name}</h2>
                    <p className="lh-ccard__desc">{c.desc}</p>
                    <dl className="lh-facts">
                      <div className="lh-fact"><Icon name="clock" size={20} /><div><dt>Längd</dt><dd>{c.duration}</dd></div></div>
                      <div className="lh-fact"><Icon name="calendar" size={20} /><div><dt>Schema</dt><dd>{c.schedule}</dd></div></div>
                      <div className="lh-fact"><Icon name="users" size={20} /><div><dt>Platser</dt><dd>{c.capacity} personer</dd></div></div>
                      <div className="lh-fact"><Icon name="tag" size={20} /><div><dt>Pris</dt><dd>{formatPrice(c.price)}{drop ? ' / tillfälle' : ''}</dd></div></div>
                    </dl>
                    <div className="lh-next" data-next={c.id}>
                      {st.code === 'loading' && <span>Hämtar lediga platser…</span>}
                      {st.code === 'error' && <span>Lediga platser kunde inte hämtas.</span>}
                      {st.next && <span><strong>{drop ? 'Nästa tillfälle:' : 'Nästa start:'}</strong> {fmtDayLong(st.next.startMs)}{st.left !== null ? ` · ${plats(st.left)} lediga` : ''}</span>}
                      {st.code === 'ok' && <StatusBadge tone="ok">Platser kvar</StatusBadge>}
                      {st.code === 'low' && <StatusBadge tone="low">Få platser kvar</StatusBadge>}
                      {st.code === 'full' && <><StatusBadge tone="out">Fullbokad</StatusBadge><span>Alla kommande {drop ? 'tillfällen' : 'omgångar'} är fullbokade.</span></>}
                    </div>
                    {DEMO && (st.code === 'full'
                      ? <Button variant="primary" block disabled>Fullbokad</Button>
                      : <Button variant="primary" block disabled={st.code === 'loading'} onClick={() => choose(c)}>{drop ? 'Välj tillfälle' : 'Välj kursomgång'}</Button>)}
                  </article>
                );
              })}
            </div>
          </div>
        );
      }

      if (step === 2) {
        return (
          <div className="lh-flow">
            <StepTitle n={1} total={2} title={course.kind === 'dropin' ? 'Välj tillfälle' : 'Välj kursomgång'} sub={`${course.name} · ${course.schedule}`} onBack={reset} />
            <ErrorBox text={error} />
            {DEMO && <p className="lh-steph__sub" style={{ marginTop: '-6px', marginBottom: '12px' }}><Icon name="info" size={18} />Datumen är exempel i demon.</p>}
            {takenState === 'loading' && <Card><LoadingState text="Hämtar lediga platser…" /></Card>}
            {takenState === 'error' && <Card><ErrorState text="Platserna kunde inte hämtas." onRetry={() => loadSeats(course)} /></Card>}
            {takenState === 'ok' && (
              <div className="lh-opts">
                {occs.map(o => {
                  const l = left(o), full = l <= 0, on = occ && occ.key === o.key;
                  return (
                    <button key={o.key} type="button" data-occ={o.key} className="lh-opt" aria-pressed={on ? 'true' : 'false'} disabled={full} onClick={() => { setOcc(o); setCount(1); setError(null); }}>
                      <span className="lh-opt__check" aria-hidden="true">{on && <Icon name="check" size={16} strokeWidth={3} />}</span>
                      <span className="lh-opt__main">
                        <span className="lh-opt__name">{course.kind === 'dropin' ? fmtDayLong(o.startMs) : 'Start ' + fmtDayLong(o.startMs).toLowerCase()}</span>
                        <span className="lh-opt__meta"><span><Icon name="clock" size={16} />{fmtTime(o.startMs)}–{fmtTime(o.endMs)}{o.lastMs ? ` · ${course.weeks} gånger, sista ${fmtDate(o.lastMs)}` : ''}</span>{on && <span className="lh-opt__vald">Vald</span>}</span>
                      </span>
                      <span className="lh-opt__state" style={{ color: full ? '#5B4A3C' : l <= 2 ? T.color.terracottaText : T.color.forest }}>{full ? 'Fullbokad' : plats(l) + ' kvar'}</span>
                    </button>
                  );
                })}
              </div>
            )}
            {occ && (
              <Card style={{ marginTop: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px' }}>
                <strong style={{ color: T.color.forest, fontSize: '16px' }} id="antal-rubrik">Antal platser</strong>
                <div className="lh-qty" role="group" aria-labelledby="antal-rubrik" style={{ gap: '14px' }}>
                  <button type="button" className="lh-qtybtn" aria-label="Färre" disabled={count <= 1} onClick={() => setCount(count - 1)}><Icon name="minus" size={20} /></button>
                  <span className="lh-qty__n" data-testid="antal" aria-live="polite">{count}</span>
                  <button type="button" className="lh-qtybtn" aria-label="Fler" disabled={count >= Math.min(4, left(occ))} onClick={() => setCount(count + 1)}><Icon name="plus" size={20} /></button>
                </div>
              </Card>
            )}
            <ActionBar label={occ ? `Fortsätt · ${plats(count)} · ${formatPrice(course.price * count)}` : (course.kind === 'dropin' ? 'Välj ett tillfälle' : 'Välj en omgång')} enabled={!!occ} onClick={() => { setStep(3); setError(null); }} />
          </div>
        );
      }

      return (
        <div className="lh-flow">
          <StepTitle n={2} total={2} title="Dina uppgifter" sub="Kontrollera bokningen och fyll i dina uppgifter." onBack={() => { setStep(2); setError(null); }} />
          <ErrorBox text={error} />
          <Card className="lh-sum">
            <InfoRow icon="palette"><strong>{course.name}</strong></InfoRow>
            <InfoRow icon="calendar"><strong>{fmtDayLong(occ.startMs)}</strong>{occ.lastMs ? ` – sista gången ${fmtDate(occ.lastMs)}` : ''}</InfoRow>
            <InfoRow icon="clock"><strong>{fmtTime(occ.startMs)}–{fmtTime(occ.endMs)}</strong></InfoRow>
            <InfoRow icon="users">{plats(count)}</InfoRow>
            <InfoRow icon="tag"><strong>{formatPrice(course.price * count)}</strong> (betalas på plats)</InfoRow>
          </Card>
          <ContactFields form={form} setForm={setForm} tried={tried} idp="kurs" />
          <ActionBar label={sending ? 'Bokar…' : `Boka · ${formatPrice(course.price * count)}`} enabled={!sending} onClick={submit} />
        </div>
      );
    }

    // ---------- SHOP ----------
    function Shop() {
      const [cart, setCart] = useState(() => { try { return JSON.parse(sessionStorage.getItem('lias_cart')) || {}; } catch (e) { return {}; } });
      const [stock, setStock] = useState(null);
      const [step, setStep] = useState(1);
      const [form, setForm] = useState({ name: '', phone: '', email: '' });
      const [payment, setPayment] = useState(null);
      const [tried, setTried] = useState(false);
      const [paying, setPaying] = useState(false);
      const [error, setError] = useState(null);
      const [done, setDone] = useState(null);
      const [cat, setCat] = useState('alla');
      const [detail, setDetail] = useState(null);
      const opener = useRef(null);
      const openDetail = (id, el) => { opener.current = el; setDetail(id); };
      const closeDetail = () => { setDetail(null); const el = opener.current; setTimeout(() => { if (el && el.focus) el.focus(); }, 0); };
      useBackClose(!!detail, closeDetail);
      useEffect(() => {
        if (!detail) return;
        const b = document.querySelector('.lh-dbar [aria-label="Stäng"]'); if (b) b.focus();
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = ''; };
      }, [detail]);
      const dialogKey = e => {
        if (e.key === 'Escape') { closeDetail(); return; }
        if (e.key !== 'Tab') return;
        const fs = [...e.currentTarget.querySelectorAll('button:not([disabled])')]; if (!fs.length) return;
        if (e.shiftKey && document.activeElement === fs[0]) { e.preventDefault(); fs[fs.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === fs[fs.length - 1]) { e.preventDefault(); fs[0].focus(); }
      };

      useEffect(() => { try { sessionStorage.setItem('lias_cart', JSON.stringify(cart)); } catch (e) {} }, [cart]);
      useEffect(() => { window.scrollTo(0, 0); }, [step, done]);
      const [stockErr, setStockErr] = useState(false);
      const loadStock = async () => { if (!DEMO) return; setStockErr(false); const { data, error: err } = await sb.rpc('get_stock'); if (err) setStockErr(true); else setStock(data); };
      useEffect(() => { loadStock(); }, []);
      // Ta bort varor som inte längre finns i lager
      useEffect(() => {
        if (!stock) return;
        const fixed = {}; let changed = false;
        Object.entries(cart).forEach(([id, q]) => { const n = Math.min(q, stock[id] || 0); if (n > 0) fixed[id] = n; if (n !== q) changed = true; });
        if (changed) setCart(fixed);
      }, [stock]);

      const lines = SHOP_DATA.filter(p => cart[p.id]).map(p => ({ ...p, qty: cart[p.id] }));
      const count = lines.reduce((a, l) => a + l.qty, 0);
      const total = lines.reduce((a, l) => a + l.qty * l.price, 0);
      const setQty = (id, q) => setCart(prev => { const n = { ...prev }; if (q <= 0) delete n[id]; else n[id] = q; return n; });
      const max = id => Math.min(10, stock ? (stock[id] || 0) : 0);

      const qtyControl = p => (
        <div className="lh-qty" data-qty={p.id}>
          <button type="button" className="lh-qtybtn" aria-label={'Färre ' + p.name} onClick={() => setQty(p.id, (cart[p.id] || 0) - 1)}><Icon name="minus" size={20} /></button>
          <span className="lh-qty__n" aria-live="polite">{cart[p.id] || 0}</span>
          <button type="button" className="lh-qtybtn" aria-label={'Fler ' + p.name} disabled={(cart[p.id] || 0) >= max(p.id)} onClick={() => setQty(p.id, (cart[p.id] || 0) + 1)}><Icon name="plus" size={20} /></button>
        </div>
      );
      const stockBadge = n => n === 0 ? <StatusBadge tone="out">Slut i lager</StatusBadge> : n <= 2 ? <StatusBadge tone="low">Endast {n} kvar</StatusBadge> : <StatusBadge tone="ok">I lager</StatusBadge>;
      const buyControl = (p, n) => cart[p.id]
        ? qtyControl(p)
        : <Button variant="primary" block className="lh-btn--sm" data-buy={p.id} disabled={n === null || n === 0} onClick={() => setQty(p.id, 1)}>{n === 0 ? 'Slut i lager' : 'Lägg i varukorg'}</Button>;

      const pay = async () => {
        setTried(true);
        const v = contactCheck(form);
        if (!v.all || !payment || paying) return;
        setPaying(true); setError(null);
        await new Promise(r => setTimeout(r, 1200));   // simulerad betalning (demo)
        const { data, error: err } = await sb.rpc('place_order', { p_items: lines.map(l => ({ id: l.id, qty: l.qty })), p_payment: payment, p_name: form.name.trim(), p_phone: v.phoneDigits, p_email: form.email.trim() });
        setPaying(false);
        if (err) {
          const r = bookingErrorText(err);
          const prod = r.code === 'SLUT_I_LAGER' && SHOP_DATA.find(p => String(err.message).endsWith(':' + p.id));
          setError(prod ? `Tyvärr räcker inte lagret för ${prod.name}. Varukorgen har uppdaterats.` : r.text);
          loadStock();
          return;
        }
        setDone(data); setCart({});
      };

      if (done) {
        return (
          <div className="lh-flow">
            <DoneCard title="Tack för ditt köp!" sub={`Ordernummer ${done.number}`} onDone={() => { setDone(null); setStep(1); setTried(false); setPayment(null); loadStock(); }} lines={[
              ...done.items.map(i => <InfoRow icon="bag">{i.qty} st {i.name} <span style={{ color: T.color.textMuted }}>({formatPrice(i.qty * i.price)})</span></InfoRow>),
              <InfoRow icon={done.payment === 'swish' ? 'smartphone' : 'creditCard'}><strong>{formatPrice(done.total)}</strong> betalt med {done.payment === 'swish' ? 'Swish' : 'kort'}{DEMO ? ' (demo)' : ''}</InfoRow>,

    function Gallery({ dispatch }) {
      const [cat, setCat] = useState('alla');
      const [extra, setExtra] = useState([]);
      useEffect(() => { if (!DEMO) return; let live = true; sb.rpc('get_photos').then(({ data, error }) => { if (live && !error && data) setExtra(data); }); return () => { live = false; }; }, []);
      const [open, setOpen] = useState(null);   // index i listan som visas
      const opener = useRef(null);
      const all = [...extra.map(p => ({ id: 'foto-' + p.id, src: p.src, cat: p.cat, own: true, title: p.title, alt: 'Bild från Lias salong: ' + p.title })), ...GALLERY];
      const list = all.filter(g => cat === 'alla' || g.cat === cat);
      const own = list.filter(g => g.own), insp = list.filter(g => !g.own);
      const ordered = [...own, ...insp];
      const cur = open !== null ? ordered[open] : null;
      const close = () => { setOpen(null); const el = opener.current; setTimeout(() => { if (el && el.focus) el.focus(); }, 0); };
      useBackClose(open !== null, close);
      const step = d => setOpen(i => (i + d + ordered.length) % ordered.length);
      useEffect(() => {
        if (open === null) return;

        return () => { document.body.style.overflow = ''; };
      }, [open === null]);
      const key = e => {
        if (e.key === 'Escape') { close(); return; }
        if (e.key === 'ArrowRight') { step(1); return; }
        if (e.key === 'ArrowLeft') { step(-1); return; }
        if (e.key !== 'Tab') return;
        const fs = [...e.currentTarget.querySelectorAll('button:not([disabled])')]; if (!fs.length) return;
        if (e.shiftKey && document.activeElement === fs[0]) { e.preventDefault(); fs[fs.length - 1].focus(); }

    // Kort pling-ljud utan ljudfil
    let AUDIO_CTX = null;
    function playChime() {
      try {
        if (!AUDIO_CTX) AUDIO_CTX = new (window.AudioContext || window.webkitAudioContext)();
        if (AUDIO_CTX.state === 'suspended') AUDIO_CTX.resume();
        [[880, 0], [1175, 0.18], [1568, 0.36]].forEach(([f, t]) => {
          const o = AUDIO_CTX.createOscillator(), g = AUDIO_CTX.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, AUDIO_CTX.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.35, AUDIO_CTX.currentTime + t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, AUDIO_CTX.currentTime + t + 0.5);
          o.connect(g); g.connect(AUDIO_CTX.destination);
          o.start(AUDIO_CTX.currentTime + t); o.stop(AUDIO_CTX.currentTime + t + 0.55);
        });
        return true;
      } catch (e) { console.error('Ljud kunde inte spelas', e); return false; }
    }

    // ---------- ADMIN: EKONOMI (steg 6) ----------
    const DAY_MS = 86400000;
    function dayKey(ms) { const t = tzParts(ms); return t.year + '-' + String(t.month).padStart(2, '0') + '-' + String(t.day).padStart(2, '0'); }
    function dayKeyLabel(key) { const [y, m, d] = key.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString('sv-SE', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, ''); return t.charAt(0).toUpperCase() + t.slice(1); }
    function lastDays(n) { const t = tzParts(Date.now()); const out = []; for (let i = 0; i < n; i++) { const u = new Date(Date.UTC(t.year, t.month - 1, t.day - i, 12)); out.push(u.getUTCFullYear() + '-' + String(u.getUTCMonth() + 1).padStart(2, '0') + '-' + String(u.getUTCDate()).padStart(2, '0')); } return out; }
    const KIND_LABEL = { shop: 'Shop', frisor: 'Frisör', kurs: 'Kurs' };
    const kr = n => formatPrice(n).replace(/,00\s?kr$/, ' kr');
    function csvCell(v) { const s = String(v == null ? '' : v); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

      const [pays, setPays] = useState(null);
      const [visits, setVisits] = useState([]);
      const [state, setState] = useState('loading');
      const [q, setQ] = useState('');

      const [month, setMonth] = useState(dayKey(Date.now()).slice(0, 7));
      const opener = useRef(null);

      const load = async () => {
        const from = new Date(Date.now() - 7 * DAY_MS).toISOString();
        const [p, b, c] = await Promise.all([
          sb.rpc('get_payments'),
          sb.from('bookings').select('*').eq('status', 'bokad').gte('starts_at', from).order('starts_at', { ascending: true }),
          sb.from('course_bookings').select('*').eq('status', 'bokad').gte('starts_at', from).order('starts_at', { ascending: true }),
        ]);
        if (p.error || b.error || c.error) { setState('error'); return; }
        const today = dayKey(Date.now());
        const v = [...(b.data || []).map(r => ({ ...r, _t: 'bookings' })), ...(c.data || []).map(r => ({ ...r, _t: 'course_bookings' }))]
          .filter(r => !r.paid && dayKey(new Date(r.starts_at).getTime()) <= today)
          .sort((x, y) => new Date(x.starts_at) - new Date(y.starts_at));
        setPays(p.data || []); setVisits(v); setState('ok');
      };
      useEffect(() => { load(); }, []);
      useEffect(() => {
        if (!sel) return;
        const bt = document.querySelector('.lh-dbar [aria-label="Stäng"]'); if (bt) bt.focus();
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = ''; };

      const sum24 = last24.reduce((a, p) => a + p.amount, 0);

      const hits = qq.length < 2 ? [] : pays.filter(p => p.receipt.toLowerCase().includes(qq) || (p.customer_name || '').toLowerCase().includes(qq) || (qd.length >= 3 && (p.customer_phone || '').includes(qd)));

                      <div className="lh-field">
                        <label htmlFor={'satt-' + v.id}>Betalsätt</label>
                        <select id={'satt-' + v.id} className="lh-input" value={f.method || ''} onChange={e => setForm(v.id, { method: e.target.value, err: null })}>

            {qq.length >= 2 && (hits.length === 0
              ? <p className="lh-econ__help" role="status" data-search="tom">Inga kvitton hittades.</p>

          <Card style={{ marginTop: '14px' }}>

            <p className="lh-econ__help">En fil (CSV) med månadens betalningar. Den öppnas i Excel och kan skickas till revisorn.</p>
            <div className="lh-field">
              <label htmlFor="export-manad">Månad</label>
              <select id="export-manad" className="lh-input" value={month} onChange={e => setMonth(e.target.value)}>{months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}</select>
            </div>
            <p className="lh-econ__help" data-export-info>{monthPays.length} betalningar · {kr(monthPays.reduce((a, p) => a + p.amount, 0))}</p>
            <Button variant="secondary" block disabled={monthPays.length === 0} onClick={exportCsv}>Ladda ner {monthLabel(month).toLowerCase()} (CSV)</Button>
            <p className="lh-econ__help" style={{ marginTop: '10px' }}>Direktkoppling till Fortnox eller liknande kräver Supabase och en server – planeras senare.</p>
          </Card>

          {sel && (
            <div className="lh-dialog-bg" onClick={e => { if (e.target === e.currentTarget) closeSel(); }}>
              <div className="lh-dialog" role="dialog" aria-modal="true" aria-labelledby="kvitto-rubrik" data-receipt={sel.receipt} onKeyDown={e => { if (e.key === 'Escape') closeSel(); }}>

                <div className="lh-dialog__body">
                  <h2 id="kvitto-rubrik">Kvitto {sel.receipt}</h2>

                  <InfoRow icon={sel.kind === 'shop' ? 'bag' : sel.kind === 'kurs' ? 'palette' : 'scissors'}>{KIND_LABEL[sel.kind]}: {sel.items ? sel.items.map(i => `${i.qty} st ${i.name} (${kr(i.qty * i.price)})`).join(', ') : sel.text}</InfoRow>
                  <InfoRow icon="user">{sel.customer_name} · {sel.customer_phone}</InfoRow>
                  <InfoRow icon={sel.method === 'swish' ? 'smartphone' : sel.method === 'kort' ? 'creditCard' : 'tag'}><strong>{kr(sel.amount)}</strong> · {PAY_METHODS[sel.method]}</InfoRow>
                  <p style={{ fontSize: '15px', color: T.color.textMuted }}>Översikt – inte ett kassakvitto.</p>
                  <Button variant="secondary" block icon="chevronLeft" data-tillbaka="botten" onClick={closeSel}>Tillbaka</Button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onerror = () => reject(new Error('OGILTIG_BILD'));
        fr.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('OGILTIG_BILD'));
          img.onload = () => {
            const tryAt = (max, q) => {
              const s = Math.min(1, max / Math.max(img.width, img.height));
              const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
              const ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
              return c.toDataURL('image/jpeg', q);
            };
            let out = tryAt(1000, 0.82);
            if (out.length > 380000) out = tryAt(800, 0.72);
            if (out.length > 380000) out = tryAt(640, 0.65);
            resolve(out);
          };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

      const [section, setSection] = useState('bokningar');
      const [, setTick] = useState(0);
      useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t); }, []);   // färgerna byter läge av sig själva
      const seen = useRef(new Set());
      const loadedOnce = useRef(false);
      const alarmRef = useRef(false);
      const baseTitle = useRef(document.title);

      useEffect(() => { alarmRef.current = alarmOn; }, [alarmOn]);
      useEffect(() => {
        sb.auth.getSession().then(({ data }) => setSession((data && data.session) || null)).catch(() => setSession(null));
      }, []);
      useEffect(() => {
        if (!session) { setIsAdmin(null); return; }
        sb.rpc('is_admin').then(({ data, error }) => setIsAdmin(!error && data === true)).catch(() => setIsAdmin(false));
      }, [session]);

      const describe = (table, r) => {
        if (table === 'orders') return { title: `Ny beställning ${r.number}: ${r.customer_name}`, body: r.items.map(i => i.qty + ' st ' + i.name).join(', ') + ' · ' + r.total + ' kr' };
        const s = new Date(r.starts_at).getTime();
        if (table === 'course_bookings') return { title: 'Ny kursbokning: ' + r.customer_name, body: `${r.course_name}\n${fmtDayLong(s)} kl ${fmtTime(s)} · ${plats(r.seats)}` };
        return { title: 'Ny bokning: ' + r.customer_name + (r.person_name ? ' (' + r.person_name + ')' : ''), body: fmtDayLong(s) + ' kl ' + fmtTime(s) + '\n' + (r.person_name ? r.person_name + ': ' : '') + r.service_names };
      };
      const alarm = (table, r) => {
        setNewIds(prev => [...prev, r.id]);
        document.title = '🔔 Ny ' + (table === 'orders' ? 'beställning' : 'bokning') + ' – ' + baseTitle.current;
        if (!alarmRef.current) return;
        playChime();
        try {
          const d = describe(table, r);
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification(d.title, { body: d.body, tag: r.id });
        } catch (e) { console.error(e); }
      };
      const sortBy = (table, arr) => [...arr].sort((a, b) => table === 'orders' ? new Date(a.created_at) - new Date(b.created_at) : new Date(a.starts_at) - new Date(b.starts_at));
      const query = t => t === 'orders'
        ? sb.from('orders').select('*').neq('status', 'hamtad').order('created_at', { ascending: true })
        : sb.from(t).select('*').eq('status', 'bokad').gte('ends_at', new Date(startOfToday()).toISOString()).order('starts_at', { ascending: true });

      const load = async () => {
        if (!loadedOnce.current) setListState('loading');
        const results = await Promise.all(TABLES.map(t => query(t)));
        if (results.some(r => r.error)) { results.forEach(r => r.error && console.error(r.error)); if (!loadedOnce.current) setListState('error'); return; }
        const next = { bookings: [], course_bookings: [], orders: [] };
        TABLES.forEach((t, i) => {
          const rows = results[i].data || [];
          if (loadedOnce.current) rows.forEach(r => { if (!seen.current.has(r.id)) alarm(t, r); });
          rows.forEach(r => seen.current.add(r.id));
          next[t] = sortBy(t, rows);
        });
        loadedOnce.current = true;
        setLists(next); setListState('ok');
      };

      useEffect(() => {
        if (!isAdmin) return;
        load();
        let ch = sb.channel('nya-bokningar');
        TABLES.forEach(t => {
          ch = ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: t }, payload => {
            const r = payload.new;
            if (!r || seen.current.has(r.id)) return;
            if (t !== 'orders' && r.status !== 'bokad') return;
            seen.current.add(r.id);
            setLists(prev => ({ ...prev, [t]: sortBy(t, [...prev[t], r]) }));
            alarm(t, r);
          });
        });
        ch.subscribe(status => setLive(status === 'SUBSCRIBED'));
        const poll = setInterval(load, 60000);   // reserv om liveanslutningen tappas
        return () => { clearInterval(poll); sb.removeChannel(ch); };
      }, [isAdmin]);

      const login = async e => {
        e.preventDefault();
        setLoggingIn(true); setLoginError(null);
        const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pwd });
        setLoggingIn(false);
        if (error) { setLoginError('Fel e-post eller lösenord.'); return; }
        setPwd(''); setSession(data.session);
      };
      const logout = async () => { await sb.auth.signOut(); setSession(null); document.title = baseTitle.current; dispatch({ type: 'TAB', p: 'home' }); };
      const activateAlarm = async () => {
        playChime();
        if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
          try { setNotifState(await Notification.requestPermission()); } catch (e) { console.error(e); }
        }
        setAlarmOn(true);
      };
      const setStatus = async (table, r, status, question) => {
        if (question && !window.confirm(question)) return;
        const { error } = await sb.from(table).update({ status }).eq('id', r.id);
        if (error) { window.alert('Ändringen misslyckades. Försök igen.'); return; }
        setLists(prev => ({ ...prev, [table]: (status === 'avbokad' || status === 'hamtad') ? prev[table].filter(x => x.id !== r.id) : prev[table].map(x => x.id === r.id ? { ...x, status } : x) }));
      };

      const wrap = { padding: '20px 16px', maxWidth: '800px', margin: '0 auto' };
      const btn = bg => ({ padding: '10px 16px', backgroundColor: bg, color: COLORS.sand1, border: 'none', borderRadius: '8px', fontWeight: '700', fontSize: '14px', cursor: 'pointer' });
      const small = bg => ({ ...btn(bg), marginTop: '10px', padding: '8px 14px', fontSize: '13px' });
      const H = { color: 'var(--flow-fg, #F4EDE0)', fontSize: '19px', fontFamily: T.font.heading, margin: '22px 0 10px 0' };
      const card = id => ({ ...BOX, borderColor: newIds.includes(id) ? COLORS.sandBrown : COLORS.earthBrown, boxShadow: newIds.includes(id) ? '0 0 0 3px #E8B863' : 'none' });
      const nyBadge = id => newIds.includes(id) && <span style={{ backgroundColor: '#E8B863', color: COLORS.dark, padding: '2px 8px', borderRadius: '6px', fontSize: '11px', fontWeight: '800' }}>NY</span>;
      const contact = r => (
        <div style={{ fontSize: '14px', color: COLORS.dark, lineHeight: '1.7' }}>
          <div>👤 <strong>{r.customer_name}</strong></div>
          <div>📞 <a href={'tel:' + r.customer_phone} style={{ color: COLORS.primary }}>{r.customer_phone}</a></div>
          <div>📧 <a href={'mailto:' + r.customer_email} style={{ color: COLORS.primary }}>{r.customer_email}</a></div>
        </div>
      );

      if (!sb) return <div style={wrap}><div style={BOX}><strong style={{ color: COLORS.earthBrown }}>Admin är inte kopplad till Supabase ännu.</strong></div></div>;
      if (session === undefined) return <div style={wrap}><div style={BOX}>Kontrollerar inloggning…</div></div>;

      if (!session) {
        return (
          <div style={{ ...wrap, maxWidth: '420px' }}>
            <form onSubmit={login} style={{ ...BOX, padding: '28px' }}>
              <h2 style={{ color: COLORS.earthBrown, fontSize: '22px', fontFamily: T.font.heading, margin: '0 0 16px 0', textAlign: 'center' }}>Admin-inloggning</h2>
              {DEMO && <div style={{ backgroundColor: '#E8B863', borderRadius: '8px', padding: '10px', fontSize: '13px', color: COLORS.dark, marginBottom: '14px' }}>🧪 Demo: logga in med <strong>{DEMO_LOGIN.email}</strong> och lösenordet <strong>{DEMO_LOGIN.password}</strong></div>}
              <label style={{ display: 'block', fontWeight: '700', color: COLORS.dark, marginBottom: '6px', fontSize: '13px' }}>E-post</label>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" style={{ ...INPUT, marginBottom: '12px' }} />
              <label style={{ display: 'block', fontWeight: '700', color: COLORS.dark, marginBottom: '6px', fontSize: '13px' }}>Lösenord</label>
              <input type="password" value={pwd} onChange={e => setPwd(e.target.value)} autoComplete="current-password" style={{ ...INPUT, marginBottom: '14px' }} />
              {loginError && <div style={{ color: COLORS.error, fontWeight: '700', fontSize: '14px', marginBottom: '12px' }}>⚠️ {loginError}</div>}
              <button type="submit" disabled={loggingIn} style={{ ...btn(COLORS.rosemary), width: '100%', padding: '14px' }}>{loggingIn ? 'Loggar in…' : 'Logga in'}</button>
            </form>
          </div>
        );
      }
      if (isAdmin === null) return <div style={wrap}><div style={BOX}>Kontrollerar behörighet…</div></div>;
      if (isAdmin === false) return <div style={wrap}><div style={BOX}><strong style={{ color: COLORS.earthBrown }}>Det här kontot har inte admin-behörighet.</strong><div style={{ marginTop: '12px' }}><button onClick={logout} style={btn(COLORS.rosemary)}>Logga ut</button></div></div></div>;

      // Frisörtider grupperade per dag
      const groups = [];
      lists.bookings.forEach(b => {
        const label = fmtDayLong(new Date(b.starts_at).getTime());
        if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
        groups[groups.length - 1].items.push(b);
      });

      return (
        <div style={wrap}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px', marginBottom: '14px' }}>
            <h1 style={{ color: 'var(--flow-fg, #F4EDE0)', fontSize: '24px', fontFamily: T.font.heading, margin: 0 }}>Admin</h1>
            <button onClick={logout} style={{ ...btn(COLORS.rosemary), border: `2px solid ${COLORS.sand1}`, whiteSpace: 'nowrap' }}>Logga ut</button>
          </div>

          <div className="lh-chips lh-admintabs" role="group" aria-label="Admin-delar">
            {[['bokningar', 'Bokningar'], ['ekonomi', 'Ekonomi'], ['bilder', 'Bilder']].map(([id, label]) => <FilterChip key={id} selected={section === id} data-admintab={id} onClick={() => setSection(id)}>{label}</FilterChip>)}
          </div>
          {section === 'ekonomi' && (DEMO ? <AdminEconomy /> : <Card><h2 className="lh-cardtitle">Ekonomi</h2><p style={{ margin: 0, fontSize: '16px', lineHeight: 1.5 }}>Kräver att Supabase kopplas in med tabeller för betalningar. Det är inte byggt än.</p></Card>)}
          {section === 'bilder' && (DEMO ? <AdminPhotos /> : <Card><h2 className="lh-cardtitle">Bilder</h2><p style={{ margin: 0, fontSize: '16px', lineHeight: 1.5 }}>Kräver att Supabase kopplas in med lagring för bilder (Storage). Det är inte byggt än.</p></Card>)}
          {section === 'bokningar' && <>
          <div style={{ ...BOX, display: 'grid', gap: '10px' }}>
            <div style={{ fontSize: '14px', fontWeight: '700', color: COLORS.dark }}>
              {live ? '🟢 Live – nya bokningar dyker upp direkt' : '🟡 Ansluter… (listan uppdateras ändå varje minut)'}
            </div>
            {alarmOn
              ? <div style={{ fontSize: '14px', color: COLORS.dark }}>🔔 <strong>Larmet är på.</strong> {notifState === 'granted' ? 'Ljud och skärmnotis vid ny bokning.' : 'Ljud vid ny bokning (skärmnotiser är inte tillåtna i webbläsaren).'} <button onClick={playChime} style={{ marginLeft: '6px', background: 'none', border: 'none', color: COLORS.sandBrown, textDecoration: 'underline', cursor: 'pointer', fontSize: '13px' }}>Testa ljud</button></div>
              : <div><button onClick={activateAlarm} style={{ ...btn(COLORS.sandBrown), width: '100%', padding: '14px' }}>🔔 Slå på larm (ljud + notis)</button><div style={{ fontSize: '12px', color: COLORS.dark, marginTop: '6px' }}>Webbläsaren kräver ett tryck här varje gång sidan öppnas, annars får den inte spela ljud.</div></div>}
          </div>

          {listState === 'loading' && <div style={{ ...BOX, marginTop: '18px' }}>Hämtar bokningar…</div>}
          {listState === 'error' && <div style={{ ...BOX, marginTop: '18px' }}>Bokningarna kunde inte hämtas. <button onClick={load} style={btn(COLORS.sandBrown)}>Försök igen</button></div>}

          {listState === 'ok' && <>
            <h2 style={H}>✂️ Frisörtider ({lists.bookings.length})</h2>
            {lists.bookings.length === 0 && <div style={{ ...BOX, textAlign: 'center' }}>Inga kommande bokningar.</div>}
            {groups.map(g => (
              <section key={g.label} style={{ marginBottom: '14px' }}>
                <h3 style={{ color: 'var(--flow-fg, #F4EDE0)', fontSize: '16px', margin: '0 0 8px 0' }}>{g.label}</h3>
                <div style={{ display: 'grid', gap: '10px' }}>
                  {g.items.map(b => {
                    const s = new Date(b.starts_at).getTime(), e = new Date(b.ends_at).getTime();
                    return (
                      <div key={b.id} data-booking={b.id} data-state={cutState(b, Date.now())} className={'lh-cut lh-cut--' + cutState(b, Date.now())} style={newIds.includes(b.id) ? { boxShadow: '0 0 0 3px #E8B863' } : undefined}>
                        <div className="lh-cut__top">
                          <span className="lh-cut__badge" data-badge>{cutState(b, Date.now()) === 'pagar' && <Icon name="scissors" size={16} />}{cutState(b, Date.now()) === 'klar' && <Icon name="check" size={16} strokeWidth={3} />}{cutState(b, Date.now()) === 'kommande' && <Icon name="clock" size={16} />}{CUT_STATE[cutState(b, Date.now())]}</span>{nyBadge(b.id)}
                        </div>
                        <div className="lh-cut__title" data-cut-title>Klippning: <strong>{b.person_name || b.customer_name}</strong> {fmtTime(s)}–{fmtTime(e)}</div>
                        <div className="lh-cut__svc">{b.service_names} · {formatPrice(b.price)}</div>
                        {contact(b)}
                        {cutState(b, Date.now()) !== 'klar' && <button onClick={() => setStatus('bookings', b, 'avbokad', `Avboka ${b.person_name || b.customer_name}, ${fmtDayLong(s)} kl ${fmtTime(s)}?\nTiden blir ledig för andra kunder.`)} style={small(COLORS.error)}>Avboka</button>}
                      </div>
                    );
                  })}
                </div>
              </section>
            ))}

            {DEMO && <>
              <h2 style={H}>🎨 Kursbokningar ({lists.course_bookings.length})</h2>
              {lists.course_bookings.length === 0 && <div style={{ ...BOX, textAlign: 'center' }}>Inga kommande kursbokningar.</div>}
              <div style={{ display: 'grid', gap: '10px' }}>
                {lists.course_bookings.map(c => {
                  const s = new Date(c.starts_at).getTime(), e = new Date(c.ends_at).getTime();
                  return (
                    <div key={c.id} data-coursebooking={c.id} style={card(c.id)}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '8px' }}>
                        <strong style={{ fontSize: '16px', color: COLORS.earthBrown }}>{c.course_name}</strong>{nyBadge(c.id)}
                      </div>
                      <div style={{ fontSize: '14px', color: COLORS.dark, margin: '4px 0 8px 0' }}>{fmtDayLong(s)} · {fmtTime(s)}–{fmtTime(e)}{c.last_date ? ` (sista ${fmtDate(new Date(c.last_date).getTime())})` : ''}<br />{plats(c.seats)} · {formatPrice(c.price)}</div>
                      {contact(c)}
                      <button onClick={() => setStatus('course_bookings', c, 'avbokad', `Avboka ${c.customer_name} från ${c.course_name}?\nPlatserna blir lediga igen.`)} style={small(COLORS.error)}>Avboka</button>
                    </div>
                  );
                })}
              </div>

              <h2 style={H}>🛍️ Beställningar ({lists.orders.length})</h2>
              {lists.orders.length === 0 && <div style={{ ...BOX, textAlign: 'center' }}>Inga beställningar att hantera.</div>}
              <div style={{ display: 'grid', gap: '10px' }}>
                {lists.orders.map(o => (
                  <div key={o.id} data-order={o.id} style={card(o.id)}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '8px' }}>
                      <strong style={{ fontSize: '16px', color: COLORS.earthBrown }}>{o.number}</strong>
                      <span style={{ display: 'flex', gap: '6px' }}>{nyBadge(o.id)}<span style={{ backgroundColor: o.status === 'klar' ? '#CFE3D2' : '#F3E3C3', color: COLORS.dark, padding: '2px 8px', borderRadius: '6px', fontSize: '11px', fontWeight: '800' }}>{o.status === 'klar' ? 'KLAR ATT HÄMTA' : 'BETALD'}</span></span>
                    </div>
                    <div style={{ fontSize: '14px', color: COLORS.dark, margin: '4px 0 8px 0' }}>
                      {o.items.map(i => <div key={i.id}>{i.qty} st {i.name}</div>)}
                      <strong>{formatPrice(o.total)}</strong> · {o.payment === 'swish' ? 'Swish' : 'Kort'}
                    </div>
                    {contact(o)}
                    {o.status === 'betald'
                      ? <button onClick={() => setStatus('orders', o, 'klar')} style={small(COLORS.rosemary)}>Klar att hämta – skicka sms</button>
                      : <button onClick={() => setStatus('orders', o, 'hamtad', `Markera ${o.number} som hämtad?`)} style={small(COLORS.sandBrown)}>Hämtad</button>}
                  </div>
                ))}
              </div>
              <DemoSmsLog />
            </>}
          </>}
          </>}
        </div>
      );
    }

    function App() {
      const [state, dispatch] = useReducer(reducer, initialState);

      useEffect(() => {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            dispatch({ type: 'LOAD', p: JSON.parse(stored) });
          } catch (e) {
            console.error('Load error', e);
          }
        }
      }, []);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ gdprOk: state.gdprOk }));
      }, [state.gdprOk]);

      // Varje flik börjar längst upp (även efter omladdning)
      useEffect(() => { try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {} }, []);
      useEffect(() => { window.scrollTo(0, 0); }, [state.tab, state.nav]);

      if (!state.gdprOk) return <GDPRModal onOk={() => dispatch({ type: 'GDPR' })} />;
      const REBUILT = ['home', 'booking', 'courses', 'shop', 'contact', 'gallery', 'admin'];   // sidor med ny design (övriga byggs om i kommande steg)
      const pageBg = REBUILT.includes(state.tab) ? T.color.page : COLORS.primary;

      return (
        <div style={{ backgroundColor: pageBg, minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Header state={state} dispatch={dispatch} />
          {DEMO && <DemoBanner />}
          <main key={state.nav || 0} style={{ backgroundColor: pageBg, flex: 1, paddingBottom: '24px', ...(REBUILT.includes(state.tab) ? { '--flow-fg': T.color.onPage, '--flow-err': '#5C1A08', '--bar-bg': T.color.brand } : {}) }}>
            {state.tab === 'home' && <Home dispatch={dispatch} />}
            {state.tab === 'booking' && <Booking dispatch={dispatch} />}
            {state.tab === 'courses' && <Courses />}
            {state.tab === 'shop' && <Shop />}
            {state.tab === 'contact' && <Contact />}
            {state.tab === 'gallery' && <Gallery dispatch={dispatch} />}
            {state.tab === 'admin' && <AdminPanel dispatch={dispatch} />}
          </main>
          <Nav state={state} dispatch={dispatch} />
          <footer className="lh-footer" style={{ '--fade-from': pageBg }}>
            <p className="lh-footer__name">Lias Hantverkeri © 2026</p>
            <p className="lh-footer__place">Karlskoga, Sverige</p>
            <button onClick={() => { dispatch({ type: 'TAB', p: 'admin' }); window.scrollTo(0, 0); }} className="lh-footer__admin" style={{ marginTop: '4px', minHeight: '44px', minWidth: '44px', padding: '12px 16px', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline' }}>Admin</button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
