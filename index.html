  <meta name="apple-mobile-web-app-title" content="Lias Hantverkeri">

  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <style>
    /* ===== Designtokens (Lias Hantverkeri – skogsgrön & champagne) ===== */
    :root {
      --frame: #91744A;   /* brun ram (1 px) runt innehållsrutor – 1,5 px avrundas olika i olika webbläsare */
      --forest: #1F3D32; --forest-dark: #173026; --teal: #5FA8A8;
      --bg: #F6EED7; --sand: #EADFC8; --surface: #FBF8EF;
      --text: #4A382A; --text-muted: #6E5B4A;
      --champagne: #D4B98F; --champagne-light: #E8D8B5;
      --terracotta: #C76B4F; --terracotta-text: #9C4B33;  /* mörkare terrakotta för text: 4,6–5,7:1 */
      --brand: #2F6F70;     /* djup turkos för header och meny: beige text 5,0:1 */
      --page: #5FA8A8;      /* turkos sidbakgrund */
      --on-page: #173026;   /* text direkt på turkos: 5,2:1 */
      --font-heading: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px; --space-xxl: 32px;
      --r-card: 18px; --r-btn: 14px; --r-input: 12px; --r-pill: 999px;
      --shadow-card: 0 1px 2px rgba(31,61,50,0.06), 0 6px 16px rgba(31,61,50,0.06);
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
      --z-actionbar: 900; --z-header: 950; --z-nav: 1000; --z-modal: 9999;
      /* Brytpunkter (används i JS och media queries): 360 / 600 / 900 px */
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: var(--font-body);
      background-color: #4B9FA6;
      color: #2C2C2C;
      -webkit-text-size-adjust: 100%;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid var(--champagne); outline-offset: 2px; box-shadow: 0 0 0 5px var(--forest);
    }

    /* Knappar */
    .lh-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: var(--r-btn); font: 600 16px/1.2 var(--font-body); border: 2px solid transparent; cursor: pointer; text-decoration: none; transition: transform .08s ease, background-color .15s ease, box-shadow .15s ease; }
    .lh-btn:active { transform: scale(0.98); }
    .lh-btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
    .lh-btn--primary { background: var(--forest); color: #FFFFFF; }
    .lh-btn--primary:hover:not([disabled]) { background: var(--forest-dark); }
    .lh-btn--champagne { background: var(--champagne); color: var(--forest); }
    .lh-btn--champagne:hover:not([disabled]) { background: #C9AB7C; }
    .lh-btn--secondary { background: transparent; color: var(--forest); border-color: var(--forest); }
    .lh-btn--secondary:hover:not([disabled]) { background: rgba(31,61,50,0.06); }
    .lh-btn--ghost { background: transparent; color: var(--forest); min-height: 44px; padding: 8px 10px; text-decoration: underline; }
    .lh-btn--block { width: 100%; }
    .lh-iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: none; background: transparent; color: inherit; cursor: pointer; }
    .lh-iconbtn:active { transform: scale(0.95); }

    /* Filterchips */
    .lh-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: var(--r-pill); border: 1.5px solid rgba(31,61,50,0.35); background: var(--surface); color: var(--forest); font: 500 15px var(--font-body); cursor: pointer; white-space: nowrap; }
    .lh-chip[aria-pressed="true"] { background: var(--forest); color: #FFFFFF; border-color: var(--forest); }

    /* Kort och statusmärken */
    .lh-card { background: var(--surface); color: var(--text); border-radius: var(--r-card); padding: 16px; border: 1px solid var(--frame); box-shadow: var(--shadow-card); }
    .lh-card--sand { background: var(--sand); }
    .lh-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); font: 600 14px var(--font-body); }
    .lh-badge--ok { color: var(--forest); background: rgba(31,61,50,0.08); }
    .lh-badge--low { color: var(--terracotta-text); background: rgba(199,107,79,0.12); }
    .lh-badge--out { color: #5B4A3C; background: rgba(74,56,42,0.10); }
    .lh-badge--info { color: var(--forest); background: rgba(95,168,168,0.18); }

    /* Formulär */
    .lh-field { margin-bottom: 16px; }
    .lh-field label { display: block; margin-bottom: 6px; font: 600 15px var(--font-body); color: var(--text); }
    .lh-field .lh-req { color: var(--terracotta-text); }
    .lh-input { width: 100%; min-height: 48px; padding: 12px 14px; font: 16px var(--font-body); color: var(--text); background: #FFFFFF; border: 1.5px solid rgba(74,56,42,0.35); border-radius: var(--r-input); }
    .lh-input[aria-invalid="true"] { border-color: var(--terracotta); border-width: 2px; }
    .lh-field .lh-err { display: flex; align-items: center; gap: 6px; margin-top: 6px; font: 500 14px var(--font-body); color: var(--terracotta-text); }
    .lh-field .lh-hint { margin-top: 4px; font: 14px var(--font-body); color: var(--text-muted); }

    /* Bild med reservyta */
    .lh-img { position: relative; overflow: hidden; width: 100%; background: linear-gradient(135deg, var(--sand), var(--bg)); }
    .lh-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .lh-img__fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; text-align: center; color: var(--text-muted); font: 500 13px var(--font-body); }

    /* Tom-, laddnings- och felläge */
    .lh-state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 16px; text-align: center; }
    .lh-state h3 { font: 600 18px var(--font-heading); color: var(--text); }
    .lh-state p { font: 16px/1.5 var(--font-body); color: var(--text-muted); }
    .lh-spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(31,61,50,0.2); border-top-color: var(--forest); animation: lh-spin .8s linear infinite; }
    @keyframes lh-spin { to { transform: rotate(360deg); } }

    /* App-header */
    .lh-header { position: sticky; top: 0; z-index: var(--z-header); display: flex; align-items: center; gap: 10px; min-height: 60px; padding: calc(8px + var(--safe-top)) 12px 8px; background: var(--brand); color: var(--bg); }
    .lh-header__logo { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: block; }
    .lh-header__text { flex: 1; min-width: 0; }
    .lh-header__title { margin: 0; font: 600 20px/1.2 var(--font-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lh-header__sub { display: block; font: 500 12px/1.3 var(--font-body); color: var(--bg); letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Nedre navigering */
    .lh-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-nav); display: flex; gap: 0; padding: 6px 2px calc(6px + var(--safe-bottom)); background: var(--brand); border-top: 1px solid rgba(246,238,215,0.25); }
    .lh-nav__item { flex: 1 1 0; min-width: 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 0; border: none; border-radius: 12px; background: transparent; color: var(--bg); font: 500 12px var(--font-body); letter-spacing: -0.1px; cursor: pointer; }
    .lh-nav__item[aria-current="page"] { background: var(--champagne); color: var(--forest); font-weight: 700; }
    .lh-nav__item span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 340px) { .lh-nav__item { font-size: 11px; letter-spacing: -0.2px; } .lh-nav__item[aria-current="page"] { font-weight: 600; } }
    @media (max-width: 280px) { .lh-nav__item { font-size: 10px; } .lh-nav__item svg { width: 20px; height: 20px; } }

    /* Demoläge */
    .lh-demo { padding: 6px 12px; background: #F3E3BE; color: var(--text); border-bottom: 1px solid rgba(74,56,42,0.15); font: 500 13px/1.45 var(--font-body); text-align: center; }
    .lh-demo svg { vertical-align: -3px; margin-right: 4px; }
    .lh-demo strong { font-weight: 700; }
    .lh-demo button { padding: 12px 4px; margin: -12px 0; background: none; border: none; color: var(--forest); text-decoration: underline; font: 600 13px var(--font-body); cursor: pointer; }

    /* Startsida */
    .lh-home { max-width: 600px; margin: 0 auto; padding: 16px 16px 8px; }
    .lh-hero { position: relative; overflow: hidden; border-radius: var(--r-card); box-shadow: var(--shadow-card); margin-bottom: 20px; }
    .lh-hero__text { position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 18px 16px; color: var(--bg); background: linear-gradient(to top, rgba(23,48,38,0.94) 0%, rgba(23,48,38,0.80) 55%, rgba(23,48,38,0) 100%); }
    .lh-hero h2 { margin: 0 0 6px; font: 600 26px/1.15 var(--font-heading); }
    .lh-hero__sub { margin: 0; font: 500 15px/1.4 var(--font-body); }
    .lh-hero__msg { margin: 6px 0 0; font: italic 500 17px/1.3 var(--font-heading); color: var(--champagne); }
    .lh-home__h { margin: 0 0 10px; font: 600 20px/1.2 var(--font-heading); color: var(--on-page); }
    .lh-entries { display: grid; gap: 12px; margin-bottom: 16px; }
    .lh-entries > * { min-width: 0; }
    .lh-entry__title, .lh-entry__text { overflow-wrap: anywhere; }
    @media (max-width: 340px) { .lh-entry__img { width: 72px; } .lh-entry { gap: 10px; } }
    .lh-entry { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 112px; padding: 12px; text-align: left; border: 1px solid var(--frame); border-radius: var(--r-card); background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); cursor: pointer; transition: transform .08s ease; }
    .lh-entry:active { transform: scale(0.99); }
    .lh-entry__img { width: 88px; flex-shrink: 0; }
    .lh-entry__body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .lh-entry__title { display: flex; align-items: center; gap: 8px; font: 600 18px/1.25 var(--font-heading); color: var(--forest); }
    .lh-entry__text { font: 16px/1.45 var(--font-body); color: var(--text-muted); }
    .lh-entry__cta { display: inline-flex; align-items: center; gap: 2px; margin-top: 2px; font: 600 15px var(--font-body); color: var(--forest); }
    .lh-intro p { font: 16px/1.6 var(--font-body); color: var(--text); }
    .lh-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    /* ===== Steg 3: sidor, filter, produktnät, kurskort, dialog ===== */
    .lh-page { max-width: 900px; margin: 0 auto; padding: 16px 16px 8px; }
    .lh-page__intro { margin: 0 0 12px; font: 16px/1.5 var(--font-body); color: var(--on-page); }
    .lh-page__note { margin: 12px 0 0; font: 15px/1.5 var(--font-body); color: var(--on-page); text-align: center; }
    .lh-chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; margin: 0 -16px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .lh-chips::-webkit-scrollbar { display: none; }
    .lh-chip { flex-shrink: 0; }
    .lh-pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 12px; }
    .lh-pgrid > *, .lh-cgrid > * { min-width: 0; }
    .lh-pcard { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    .lh-pcard__open { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; color: inherit; font: inherit; cursor: pointer; }
    .lh-pcard__body { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; flex: 1; }
    .lh-pcard__name { margin: 0; font: 600 16px/1.25 var(--font-heading); color: var(--forest); overflow-wrap: anywhere; }
    .lh-pcard__price { font: 700 16px/1.3 var(--font-body); color: var(--text); }
    .lh-pcard__actions { margin-top: auto; padding-top: 4px; }
    .lh-pcard[data-out="true"] .lh-img img { opacity: .6; }
    .lh-btn--sm { min-height: 44px; padding: 8px 12px; font-size: 15px; text-align: center; }
    .lh-qty { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .lh-qty__n { min-width: 20px; text-align: center; font: 700 17px var(--font-body); color: var(--text); }
    .lh-qtybtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid var(--forest); background: #FFFFFF; color: var(--forest); cursor: pointer; }
    .lh-qtybtn[disabled] { opacity: .4; cursor: not-allowed; }
    .lh-cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 14px; }
    .lh-ccard { display: flex; flex-direction: column; gap: 10px; }
    .lh-ccard__name { margin: 0; font: 600 19px/1.25 var(--font-heading); color: var(--forest); overflow-wrap: anywhere; }
    .lh-ccard__desc { margin: 0; font: 16px/1.5 var(--font-body); color: var(--text-muted); }
    .lh-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 12px; margin: 0; padding: 12px; border-radius: 14px; background: var(--bg); }
    .lh-fact { display: flex; gap: 8px; align-items: flex-start; min-width: 0; color: var(--forest); }
    .lh-fact dt { font: 600 14px/1.3 var(--font-body); color: var(--text-muted); }
    .lh-fact dd { margin: 2px 0 0; font: 16px/1.35 var(--font-body); color: var(--text); overflow-wrap: anywhere; }
    .lh-next { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font: 16px/1.4 var(--font-body); color: var(--text); }
    .lh-dialog-bg { position: fixed; inset: 0; z-index: var(--z-modal); display: flex; align-items: flex-end; justify-content: center; background: rgba(23,48,38,0.55); }
    .lh-dialog { position: relative; width: 100%; max-width: 520px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--surface); color: var(--text); border-radius: 22px 22px 0 0; padding-bottom: calc(16px + var(--safe-bottom)); }
    .lh-dialog__close { position: absolute; top: 10px; right: 10px; z-index: 1; background: var(--surface); color: var(--forest); border-radius: 50%; box-shadow: var(--shadow-card); }
    .lh-dialog__body { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
    .lh-dialog__body h2 { margin: 0; font: 600 22px/1.25 var(--font-heading); color: var(--forest); }
    .lh-dialog__body p { margin: 0; font: 16px/1.5 var(--font-body); color: var(--text); }
    @media (min-width: 600px) { .lh-dialog-bg { align-items: center; padding: 24px; } .lh-dialog { border-radius: 22px; } }
    .lh-thumb { width: 48px; flex-shrink: 0; }
    .lh-pcard__body .lh-badge, .lh-dialog__body .lh-badge, .lh-next .lh-badge { align-self: flex-start; }
    /* ===== Steg 4: flöden (boka, kurs, kassa), kontakt, galleri ===== */
    .lh-flow { max-width: 600px; margin: 0 auto; padding: 16px 16px 8px; }
    .lh-steph { margin-bottom: 14px; }
    .lh-steph__back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin: -6px 0 4px -6px; padding: 6px; border: 0; background: none; color: var(--flow-fg, #F4EDE0); font: 600 16px var(--font-body); cursor: pointer; }
    .lh-steph__count { font: 700 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--flow-fg, #F4EDE0); }
    .lh-steph__bar { display: flex; gap: 6px; margin: 6px 0 10px; }
    .lh-steph__bar span { flex: 1; height: 6px; border-radius: 999px; background: rgba(23,48,38,0.22); }
    .lh-steph__bar span[data-on="true"] { background: var(--forest); }
    .lh-steph__title { margin: 0; font: 600 24px/1.2 var(--font-heading); color: var(--flow-fg, #F4EDE0); }
    .lh-steph__sub { display: flex; align-items: flex-start; gap: 6px; margin: 4px 0 0; font: 16px/1.45 var(--font-body); color: var(--flow-fg, #F4EDE0); }
    .lh-label { margin: 18px 0 8px; font: 700 16px var(--font-body); color: var(--flow-fg, #F4EDE0); }
    /* Instruktion ovanför datumrutorna (testpersoner visste inte vad de skulle göra) */
    .lh-howto { margin: 16px 0 4px; padding: 14px 16px; background: var(--surface); color: var(--text); border: 1px solid var(--frame); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
    .lh-howto__title { margin: 0 0 6px; font: 600 19px/1.25 var(--font-heading); color: var(--forest); }
    .lh-howto__steps { margin: 0; padding-left: 24px; display: grid; gap: 4px; font: 16px/1.45 var(--font-body); }
    .lh-howto__swipe { display: flex; align-items: flex-start; gap: 6px; margin: 8px 0 0; font: 500 15px/1.45 var(--font-body); }
    .lh-opts { display: grid; gap: 8px; }
    .lh-opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 14px; text-align: left; background: var(--surface); color: var(--text); border: 1.5px solid rgba(74,56,42,0.18); border-radius: 16px; cursor: pointer; font: 16px var(--font-body); }
    .lh-opt[aria-pressed="true"] { border: 2.5px solid var(--forest); background: #ECF2EE; padding: 11px 13px; }
    .lh-opt[disabled] { cursor: not-allowed; background: #EEEAE6; color: #5B4A3C; }
    .lh-opt__check { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid rgba(31,61,50,0.45); color: #FFFFFF; }
    .lh-opt[aria-pressed="true"] .lh-opt__check { background: var(--forest); border-color: var(--forest); }
    .lh-opt__main { flex: 1; min-width: 0; }
    .lh-opt__name { display: block; font: 600 16px/1.3 var(--font-body); color: var(--forest); overflow-wrap: anywhere; }
    .lh-opt__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; font: 15px/1.4 var(--font-body); color: var(--text-muted); }
    .lh-opt__meta > span { display: inline-flex; align-items: center; gap: 4px; }
    .lh-opt__vald { font-weight: 700; color: var(--forest); }
    .lh-opt__price { font: 700 16px var(--font-body); white-space: nowrap; color: var(--text); }
    .lh-opt__state { font: 700 15px var(--font-body); white-space: nowrap; }
    .lh-cat { margin-bottom: 22px; }
    .lh-cat__head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .lh-cat__img { width: 64px; flex-shrink: 0; }
    .lh-cat__head h3 { margin: 0; font: 600 21px/1.2 var(--font-heading); color: var(--on-page); }
    .lh-cat__note { font: 14px var(--font-body); color: var(--on-page); }
    .lh-days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin: 0 -16px 4px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .lh-days::-webkit-scrollbar { display: none; }
    .lh-day { flex: 0 0 auto; width: 68px; min-height: 76px; padding: 8px 4px; text-align: center; background: var(--surface); color: var(--forest); border: 1.5px solid rgba(74,56,42,0.18); border-radius: 14px; cursor: pointer; font-family: var(--font-body); }
    .lh-day[aria-pressed="true"] { background: var(--forest); color: #FFFFFF; border-color: var(--forest); }
    .lh-day__wd { display: block; font: 600 13px var(--font-body); text-transform: capitalize; }
    .lh-day__d { display: block; font: 700 22px/1.2 var(--font-body); }
    .lh-day__m { display: block; font: 13px var(--font-body); }
    .lh-times { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
    .lh-time { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 48px; padding: 6px 4px; background: var(--surface); color: var(--text); border: 1.5px solid rgba(74,56,42,0.18); border-radius: 12px; font: 600 16px var(--font-body); cursor: pointer; }
    .lh-time[aria-pressed="true"] { background: var(--forest); color: #FFFFFF; border-color: var(--forest); }
    .lh-sum { display: grid; gap: 8px; }
    .lh-row { display: flex; align-items: flex-start; gap: 10px; font: 16px/1.45 var(--font-body); color: var(--text); }
    .lh-row > svg { margin-top: 2px; color: var(--forest); }
    .lh-row > div { min-width: 0; overflow-wrap: anywhere; }
    .lh-alert { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; padding: 12px 14px; background: #FBEDE8; color: #7A2E14; border: 1.5px solid var(--terracotta); border-radius: 14px; font: 600 15px/1.45 var(--font-body); }
    .lh-ferr-page { display: flex; align-items: center; gap: 6px; margin-top: 6px; font: 600 15px var(--font-body); color: var(--flow-err, #FFE3DA); }
    .lh-done { text-align: center; display: flex; flex-direction: column; gap: 12px; padding: 24px 18px; }
    .lh-done__icon { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: var(--forest); color: #FFFFFF; }
    .lh-done h2 { margin: 0; font: 600 24px/1.2 var(--font-heading); color: var(--forest); }
    .lh-done__sub { margin: 0; font: 16px var(--font-body); color: var(--text-muted); }
    .lh-done .lh-sum { text-align: left; padding: 14px; border-radius: 14px; background: var(--bg); }
    .lh-done__note { margin: 0; font: 15px/1.5 var(--font-body); color: var(--text-muted); text-align: left; }
    .lh-paybtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)); gap: 8px; }
    .lh-contact h2, .lh-cardtitle { margin: 0 0 12px; font: 600 20px/1.25 var(--font-heading); color: var(--forest); }
    .lh-contact .lh-row { padding: 6px 0; }
    .lh-contact a { color: var(--forest); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .lh-contact dt { font: 600 14px var(--font-body); color: var(--text-muted); }
    .lh-contact dd { margin: 2px 0 0; }
    .lh-hours { width: 100%; border-collapse: collapse; font: 16px var(--font-body); color: var(--text); }
    .lh-hours th, .lh-hours td { padding: 9px 4px; border-bottom: 1px solid rgba(74,56,42,0.12); text-align: left; }
    .lh-hours td { text-align: right; white-space: nowrap; }
    .lh-hours td[data-note] { white-space: normal; }   /* "Öppet vid förfrågan" får radbrytas på smal skärm */
    main strong, main a { overflow-wrap: anywhere; }   /* lång e-postadress bryts i stället för att göra sidan bredare */
    .lh-hours th { font-weight: 500; }
    .lh-hours tr[data-today="true"] th, .lh-hours tr[data-today="true"] td { font-weight: 700; color: var(--forest); }
    .lh-hours tr:last-child th, .lh-hours tr:last-child td { border-bottom: 0; }
    .lh-gsec { margin: 18px 0 8px; font: 600 20px/1.2 var(--font-heading); color: var(--on-page); }
    .lh-gsec__note { margin: -2px 0 10px; font: 15px/1.45 var(--font-body); color: var(--on-page); }
    .lh-ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 12px; }
    .lh-ggrid > * { min-width: 0; }
    .lh-gtile { display: flex; flex-direction: column; width: 100%; padding: 0; overflow: hidden; text-align: left; cursor: pointer; font: inherit; color: inherit; }
    .lh-gtile__cap { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 10px; }
    .lh-gtile__title { font: 600 16px/1.25 var(--font-heading); color: var(--forest); overflow-wrap: anywhere; }
    .lh-gtile__cat { font: 14px var(--font-body); color: var(--text-muted); }
    .lh-lightbox-bg { position: fixed; inset: 0; z-index: var(--z-modal); display: flex; align-items: center; justify-content: center; background: rgba(12,24,19,0.92); padding: calc(8px + var(--safe-top)) 8px calc(8px + var(--safe-bottom)); }
    .lh-lightbox { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 760px; max-height: 100%; color: #FFFFFF; }
    .lh-lightbox__img { display: block; width: 100%; max-height: calc(100vh - 210px); object-fit: contain; border-radius: 12px; }
    .lh-lightbox__top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; font: 600 15px var(--font-body); }
    .lh-lightbox__cap { display: flex; flex-direction: column; gap: 4px; padding: 10px 2px 4px; }
    .lh-lightbox__cap h2 { margin: 0; font: 600 20px/1.25 var(--font-heading); color: #FFFFFF; }
    .lh-lightbox__cap p { margin: 0; font: 15px/1.45 var(--font-body); color: #E7EFEA; }
    .lh-lightbox__nav { display: flex; justify-content: space-between; gap: 8px; padding-top: 6px; }
    .lh-lightbox .lh-iconbtn { color: #FFFFFF; background: rgba(255,255,255,0.12); }
    .lh-lightbox .lh-btn--secondary { color: #FFFFFF; border-color: rgba(255,255,255,0.7); }
    .lh-opt[data-pay][aria-pressed="true"] { background: #FFFFFF; }
    /* ===== Steg 6: admin – ekonomi och bilder ===== */
    .lh-admintabs { margin-top: 4px; }
    .lh-econ__note { display: flex; align-items: flex-start; gap: 6px; margin: 4px 0 12px; font: 600 15px/1.45 var(--font-body); color: var(--flow-fg, #F4EDE0); }
    .lh-econ__help { margin: 0 0 10px; font: 15px/1.45 var(--font-body); color: var(--text-muted); }
    .lh-ok { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; padding: 12px 14px; background: #ECF2EE; color: var(--forest); border: 1.5px solid var(--forest); border-radius: 14px; font: 600 15px/1.45 var(--font-body); }
    .lh-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; }
    .lh-kpi { display: flex; flex-direction: column; gap: 2px; }
    .lh-kpi__label { font: 600 14px var(--font-body); color: var(--text-muted); }
    .lh-kpi__value { font: 700 26px/1.2 var(--font-body); color: var(--forest); overflow-wrap: anywhere; }
    .lh-kpi__sub { font: 15px var(--font-body); color: var(--text-muted); }
    .lh-visits { display: grid; gap: 12px; }
    .lh-visit { padding: 12px; border: 1.5px solid rgba(74,56,42,0.18); border-radius: 14px; background: #FFFFFF; }
    .lh-visit__head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; font: 16px var(--font-body); color: var(--forest); }
    .lh-visit__what { margin: 2px 0 8px; font: 15px/1.4 var(--font-body); color: var(--text-muted); }
    .lh-visit__form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)); gap: 0 10px; }
    .lh-err-inline { display: flex; align-items: center; gap: 6px; margin: -6px 0 10px; font: 500 14px var(--font-body); color: var(--terracotta-text); }
    .lh-daytable td { font-variant-numeric: tabular-nums; }
    .lh-daytable thead th { font: 600 14px var(--font-body); color: var(--text-muted); }
    .lh-bar { display: block; height: 6px; margin-top: 4px; border-radius: 999px; background: rgba(31,61,50,0.08); }
    .lh-bar span { display: block; height: 100%; border-radius: 999px; background: var(--teal); }
    .lh-consent { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; margin: 4px 0 12px; font: 16px/1.4 var(--font-body); color: var(--text); cursor: pointer; }
